name: Reconcile

# A reusable workflow of the company's pipeline. A system's repository calls it from a
# file of a few lines, which holds the triggers and the permissions. The file runs in
# that repository, on its checkout: its own code, and .standards/ at the version it pins.

# The model on main is the state wanted, and .radical/reconciled.json the commit of it that the
# code has reached. Whatever started this run, it reads the gap between the two: with one, the coding
# agent proposes the code in a pull request, a person gets a ticket saying why it could not, or the
# work goes to the system that has to change. Nothing here merges. The merge moves the file, and the
# next run looks again. A pin reaching main is a change of the model, so it starts a run too.
#
# The agent step holds only the Claude credential. The steps after it run no AI: they commit under
# the agent's name and push with AGENT_TOKEN, because a push made with GITHUB_TOKEN would start no gate.

on:
  workflow_call:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile:
    name: Bring the code to the model
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: The standards, at the version this repository pins
        run: node tools/standards.mjs
      - uses: ./.standards/.github/actions/setup
        with:
          claude: 'true'
      - name: Look at the gap
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .standards/pipeline/tools/reconcile.mjs next
      - name: On its branch
        if: steps.look.outputs.step == 'work'
        env:
          BRANCH: ${{ steps.look.outputs.branch }}
        run: git checkout -B "$BRANCH"
      - name: What the other repositories have now
        if: steps.look.outputs.step == 'work'
        run: node .standards/pipeline/tools/delegate.mjs providers .agent/providers
      - name: Coding agent
        id: agent
        if: steps.look.outputs.step == 'work'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          BASE: ${{ steps.look.outputs.base }}
        run: node .standards/pipeline/tools/run-agent.mjs coding-agent mode=implement "base=$BASE"
      - name: What became of it
        id: outcome
        if: steps.look.outputs.step == 'work'
        env:
          AGENT: ${{ steps.agent.outcome }}
        run: node .standards/pipeline/tools/reconcile.mjs outcome .agent/report.md "$AGENT"
      - name: Commit the code
        if: steps.outcome.outputs.act == 'pull'
        run: .standards/pipeline/tools/commit-as.sh coding-agent "Implement the model"
      - name: Say which model the code has reached
        if: steps.outcome.outputs.act == 'pull'
        env:
          DESIRED: ${{ steps.look.outputs.desired }}
        run: |
          node .standards/pipeline/tools/reconcile.mjs mark "$DESIRED"
          .standards/pipeline/tools/commit-as.sh pipeline "The code reaches the model at ${DESIRED:0:7}"
      - name: Push and open the pull request
        if: steps.outcome.outputs.act == 'pull'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          AUTOMATION: ${{ vars.AGENT_AUTOMATION }}
          BRANCH: ${{ steps.look.outputs.branch }}
          DESIRED: ${{ steps.look.outputs.desired }}
          CLOSES: ${{ steps.look.outputs.closes }}
        run: |
          for ticket in $CLOSES; do printf '\n\nCloses #%s\n' "$ticket" >> .agent/report.md; done
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          # With AGENT_AUTOMATION it stays a draft until the agents are done (.standards/pipeline/tools/prepare-for-review.mjs).
          draft=""
          if [ "$AUTOMATION" = "true" ]; then draft="--draft"; fi
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Implement the model at ${DESIRED:0:7}" --body-file .agent/report.md $draft
      - name: A person reads why not, or the work is handed on
        if: steps.outcome.outputs.act == 'ask'
        env:
          GH_TOKEN: ${{ secrets.AGENT_TOKEN }}
          DELEGATE_TOKEN: ${{ secrets.DELEGATE_TOKEN }}
          DESIRED: ${{ steps.look.outputs.desired }}
        run: node .standards/pipeline/tools/reconcile.mjs stuck "$DESIRED" .agent/report.md

name: Temporary write probe
on:
  pull_request:
    paths: ['.github/workflows/tmp-write-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: radicaltools/radical.tools.sdlc.demo.2.shop
          persist-credentials: false
      - run: node tools/standards.mjs
      - uses: ./.standards/.github/actions/setup
        with:
          claude: 'true'
      - name: Probe
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cat > /tmp/show.py <<'PY'
          import json,sys
          pending={}
          for line in open(sys.argv[1]):
              try: m=json.loads(line)
              except Exception: continue
              if m.get('type')=='assistant':
                  ids=[]
                  for c in m['message'].get('content',[]):
                      if c.get('type')=='tool_use':
                          pending[c['id']]=c; ids.append(c['name'])
                  if ids: print('TURN', ids)
              if m.get('type')=='user':
                  for c in (m['message'].get('content') or []):
                      if isinstance(c,dict) and c.get('type')=='tool_result':
                          u=pending.get(c.get('tool_use_id'),{})
                          inp=u.get('input',{})
                          t=c.get('content'); t=t if isinstance(t,str) else json.dumps(t)
                          if u.get('name') in('Write','Edit') or c.get('is_error'):
                              print(u.get('name'),'err' if c.get('is_error') else 'ok',str(inp.get('file_path') or inp.get('command'))[-110:],'|',t[:260].replace('\n',' '))
              if m.get('type')=='system' and m.get('subtype')=='init':
                  print('INIT cwd',m.get('cwd'),'mode',m.get('permissionMode'))
          PY
          mkdir -p /tmp/wrap /tmp/streams
          REAL=$(command -v claude)
          cat > /tmp/wrap/claude <<WRAP
          #!/bin/sh
          n=\$(ls /tmp/streams | wc -l)
          args=""
          for a in "\$@"; do :; done
          python3 - "\$@" <<'PYW' > /tmp/args.txt
          import sys,shlex
          out=[]
          skip=False
          a=sys.argv[1:]
          for i,x in enumerate(a):
              if x=='json' and a[i-1]=='--output-format': out.append('stream-json'); continue
              out.append(x)
          print(' '.join(shlex.quote(x) for x in out+['--verbose']))
          PYW
          eval "$REAL \$(cat /tmp/args.txt)" > /tmp/streams/run\$n.jsonl
          code=\$?
          tail -n 1 /tmp/streams/run\$n.jsonl
          exit \$code
          WRAP
          chmod +x /tmp/wrap/claude
          PATH=/tmp/wrap:$PATH node .standards/pipeline/tools/explore-round.mjs 2>&1 | grep -E "^Refused|^explore-agent|NOT CHECKED|held up" | cut -c1-200 || true
          for f in /tmp/streams/*.jsonl; do echo "=== $f"; python3 /tmp/show.py "$f"; done

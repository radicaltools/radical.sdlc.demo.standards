name: Set up
description: Node, the repository's packages and, for a job that runs an agent, Claude Code.
inputs:
  claude:
    description: Also install Claude Code
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
    - run: npm ci --no-audit --no-fund
      shell: bash
    - if: inputs.claude == 'true'
      run: npm install -g @anthropic-ai/claude-code@2.1.317
      shell: bash

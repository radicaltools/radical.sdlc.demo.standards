<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 336" role="img" aria-label="Each repository holds its model, its code and its workflows. The Warehouse and the Shop read the model, the sensors and the pipeline of the standards at a pinned version, and the Shop reads the model, the OpenAPI descriptions and the images of the Warehouse at a pinned version."><style>
:root { --bg:#f4f6f9; --ink:#17202c; --muted:#566273; --rule:#d9dfe7; --arrow:#3d4a5c;
  --person:#fbefc9; --person-line:#a97a12; --agent:#e7e2fb; --agent-line:#5b47c4; --auto:#d9f0ea; --auto-line:#1b7f6b;
  --gate:#17202c; --gate-ink:#f4f6f9; --bad:#c2352c; --ask:#a97a12;
  --lane-person:#fbf6e6; --lane-agent:#f4f2fc; --lane-auto:#eaf6f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
@media (prefers-color-scheme: dark) { :root { --bg:#10151c; --ink:#e7ecf3; --muted:#9aa6b6; --rule:#28313d; --arrow:#aab5c4;
  --person:#3a2f12; --person-line:#d9a93a; --agent:#2a2452; --agent-line:#a494f2; --auto:#123a33; --auto-line:#4fc4a9;
  --gate:#e7ecf3; --gate-ink:#10151c; --bad:#f0746a; --ask:#d9a93a;
  --lane-person:#1a1810; --lane-agent:#17162a; --lane-auto:#101f1c } }
.lane-person { fill:var(--lane-person) } .lane-agent { fill:var(--lane-agent) } .lane-auto { fill:var(--lane-auto) }
.rule { stroke:var(--rule) }
.lane-name { font:600 12px var(--sans); fill:var(--muted) }
.box { stroke-width:1.2 }
.box-person { fill:var(--person); stroke:var(--person-line) }
.box-agent { fill:var(--agent); stroke:var(--agent-line) }
.box-auto { fill:var(--auto); stroke:var(--auto-line) }
.box-gate { fill:var(--gate); stroke:var(--gate) }
.title { font:600 12px var(--sans); fill:var(--ink); text-anchor:middle }
.tag { font:400 10px var(--mono); fill:var(--muted); text-anchor:middle }
.box-gate + .title, .box-gate + .title + .tag, .box-gate + .title + .tag + .tag, .box-gate + .title + .tag + .tag + .tag { fill:var(--gate-ink) }
.flow { fill:none; stroke:var(--arrow); stroke-width:1.4 }
.flow.bad { stroke:var(--bad) } .flow.ask { stroke:var(--ask); stroke-dasharray:4 3 }
.head { fill:var(--arrow) } .head-bad { fill:var(--bad) } .head-ask { fill:var(--ask) }
.note { font:400 11px var(--sans); fill:var(--muted) } .note.bad { fill:var(--bad) } .note.ask { fill:var(--ask) }
</style><defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-ask" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ask" d="M0 0 8 4 0 8z"/></marker>
</defs><rect class="lane lane-auto" x="0" y="0" width="1240" height="112"/><text class="lane-name" x="14" y="60.0">standards</text><rect class="lane lane-auto" x="0" y="112" width="1240" height="112"/><text class="lane-name" x="14" y="172.0">warehouse</text><line class="rule" x1="0" y1="112" x2="1240" y2="112"/><rect class="lane lane-auto" x="0" y="224" width="1240" height="112"/><text class="lane-name" x="14" y="284.0">shop</text><line class="rule" x1="0" y1="224" x2="1240" y2="224"/><rect class="box box-auto" x="130" y="22" width="190" height="68" rx="4"/><text class="title" x="225" y="45">Decisions and</text><text class="title" x="225" y="60">fitness functions</text><text class="tag" x="225" y="75">.radical/model</text><rect class="box box-auto" x="430" y="22" width="190" height="68" rx="4"/><text class="title" x="525" y="52.5">Sensors</text><text class="tag" x="525" y="67.5">sensors/</text><rect class="box box-agent" x="730" y="22" width="190" height="68" rx="4"/><text class="title" x="825" y="45">The pipeline,</text><text class="title" x="825" y="60">with its agents</text><text class="tag" x="825" y="75">.github/workflows, pipeline/</text><rect class="box box-auto" x="130" y="134" width="190" height="68" rx="4"/><text class="title" x="225" y="164.5">Model of the Warehouse</text><text class="tag" x="225" y="179.5">.radical/model</text><rect class="box box-auto" x="430" y="134" width="190" height="68" rx="4"/><text class="title" x="525" y="164.5">Stock and Dispatch</text><text class="tag" x="525" y="179.5">services/</text><rect class="box box-auto" x="730" y="134" width="190" height="68" rx="4"/><text class="title" x="825" y="157">Workflows that</text><text class="title" x="825" y="172">call the pipeline</text><text class="tag" x="825" y="187">a few lines each</text><rect class="box box-auto" x="1020" y="134" width="190" height="68" rx="4"/><text class="title" x="1115" y="164.5">What the Shop relies on</text><text class="tag" x="1115" y="179.5">OpenAPI, images</text><rect class="box box-auto" x="130" y="246" width="190" height="68" rx="4"/><text class="title" x="225" y="276.5">Model of the Shop</text><text class="tag" x="225" y="291.5">.radical/model</text><rect class="box box-auto" x="430" y="246" width="190" height="68" rx="4"/><text class="title" x="525" y="269">Pricing, Orders,</text><text class="title" x="525" y="284">Notifications</text><text class="tag" x="525" y="299">services/</text><rect class="box box-auto" x="730" y="246" width="190" height="68" rx="4"/><text class="title" x="825" y="269">Workflows that</text><text class="title" x="825" y="284">call the pipeline</text><text class="tag" x="825" y="299">a few lines each</text><rect class="box box-auto" x="1020" y="246" width="190" height="68" rx="4"/><text class="title" x="1115" y="269">Its contract sensor</text><text class="title" x="1115" y="284">and its deploy</text><text class="tag" x="1115" y="299">warehouse-contract, smoke</text><path class="flow " d="M225 90V134" marker-end="url(#a)"/><text class="note " x="231" y="116" text-anchor="start">the model, at a pin</text><path class="flow " d="M225 202V246" marker-end="url(#a)"/><text class="note " x="231" y="228" text-anchor="start">the model, at a pin</text><path class="flow " d="M130 56H110V280H130" marker-end="url(#a)"/><path class="flow " d="M525 90V134" marker-end="url(#a)"/><text class="note " x="531" y="116" text-anchor="start">run here, at a pin</text><path class="flow " d="M620 56H640V280H620" marker-end="url(#a)"/><path class="flow " d="M825 90V134" marker-end="url(#a)"/><text class="note " x="831" y="116" text-anchor="start">called at a pin</text><path class="flow " d="M920 56H940V280H920" marker-end="url(#a)"/><path class="flow " d="M1115 202V246" marker-end="url(#a)"/><text class="note " x="1109" y="228" text-anchor="end">OpenAPI and images, at a pin</text></svg>

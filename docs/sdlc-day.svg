122" height="68" rx="4"/><text class="title" x="725.0" y="226.5">Fixes the branch</text><text class="tag" x="725.0" y="241.5">at most 3 times</text><rect class="box box-gate" x="664" y="380" width="122" height="68" rx="4"/><text class="title" x="725.0" y="395.5">Gate</text><text class="tag" x="725.0" y="410.5">radical sense</text><text class="tag" x="725.0" y="425.5">radical check</text><text class="tag" x="725.0" y="440.5">radical diff</text><rect class="box box-agent" x="804" y="288" width="122" height="68" rx="4"/><text class="title" x="865.0" y="311.0">Proposes the</text><text class="title" x="865.0" y="326.0">missing tests</text><text class="tag" x="865.0" y="341.0">Radical MCP</text><rect class="box box-auto" x="804" y="380" width="122" height="68" rx="4"/><text class="title" x="865.0" y="410.5">Merges green</text><text class="title" x="865.0" y="425.5">proposals</text><rect class="box box-auto" x="944" y="380" width="122" height="68" rx="4"/><text class="title" x="1005.0" y="410.5">Marks it ready</text><text class="tag" x="1005.0" y="425.5">draft to ready</text><rect class="box box-person" x="1084" y="12" width="122" height="68" rx="4"/><text class="title" x="1145.0" y="42.5">Reads, then merges</text><text class="tag" x="1145.0" y="57.5">Radical Studio</text><rect class="box box-auto" x="1224" y="380" width="122" height="68" rx="4"/><text class="title" x="1285.0" y="403.0">Deploys</text><text class="tag" x="1285.0" y="418.0">radical sense</text><text class="tag" x="1285.0" y="433.0">radical check</text><path class="flow " d="M165.0 80V414H244" marker-end="url(#a)"/><path class="flow " d="M305.0 380V138H384" marker-end="url(#a)"/><path class="flow ask" d="M421.0 104V80" marker-end="url(#a-ask)"/><text class="note ask" x="415.0" y="96" text-anchor="end">asks if unclear</text><path class="flow ask" d="M469.0 80V104" marker-end="url(#a-ask)"/><text class="note ask" x="475.0" y="96" text-anchor="start">restarts it</text><path class="flow " d="M506 138H585.0V196" marker-end="url(#a)"/><path class="flow " d="M585.0 264V414H664" marker-end="url(#a)"/><text class="note " x="591.0" y="406" text-anchor="start">draft PR</text><path class="flow bad" d="M703.0 380V264" marker-end="url(#a-bad)"/><text class="note bad" x="697.0" y="330" text-anchor="end">red</text><path class="flow " d="M747.0 264V380" marker-end="url(#a)"/><text class="note " x="753.0" y="306" text-anchor="start">pushed</text><path class="flow " d="M786 414H804" marker-end="url(#a)"/><text class="note " x="790" y="374" text-anchor="start">green</text><path class="flow " d="M776 380V322H804" marker-end="url(#a)"/><path class="flow " d="M865.0 356V380" marker-end="url(#a)"/><path class="flow " d="M926 414H944" marker-end="url(#a)"/><path class="flow " d="M1066 414H1075V46H1084" marker-end="url(#a)"/><text class="note " x="1070" y="354" text-anchor="end">ready</text><path class="flow " d="M1206 46H1285.0V380" marker-end="url(#a)"/><text class="note " x="1291.0" y="126" text-anchor="start">on merge</text><text class="note " x="1285.0" y="448" text-anchor="start"></text></svg>

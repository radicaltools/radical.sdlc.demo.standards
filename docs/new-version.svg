<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1364 368" role="img" aria-label="A person tags the standards. Automation opens a pull request in the Warehouse and in the Shop that moves the pin, and the Gate of each checks that repository against the new version. Each team merges when it can. A tag of the Warehouse then does the same towards the Shop."><style>
:root { --bg:#f4f6f9; --ink:#17202c; --muted:#566273; --rule:#d9dfe7; --arrow:#3d4a5c;
  --person:#fbefc9; --person-line:#a97a12; --agent:#e7e2fb; --agent-line:#5b47c4; --auto:#d9f0ea; --auto-line:#1b7f6b;
  --gate:#17202c; --gate-ink:#f4f6f9; --bad:#c2352c; --ask:#a97a12;
  --lane-person:#fbf6e6; --lane-agent:#f4f2fc; --lane-auto:#eaf6f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
@media (prefers-color-scheme: dark) { :root { --bg:#10151c; --ink:#e7ecf3; --muted:#9aa6b6; --rule:#28313d; --arrow:#aab5c4;
  --person:#3a2f12; --person-line:#d9a93a; --agent:#2a2452; --agent-line:#a494f2; --auto:#123a33; --auto-line:#4fc4a9;
  --gate:#e7ecf3; --gate-ink:#10151c; --bad:#f0746a; --ask:#d9a93a;
  --lane-person:#1a1810; --lane-agent:#17162a; --lane-auto:#101f1c } }
.lane-person { fill:var(--lane-person) } .lane-agent { fill:var(--lane-agent) } .lane-auto { fill:var(--lane-auto) }
.rule { stroke:var(--rule) }
.lane-name { font:600 12px var(--sans); fill:var(--muted) }
.box { stroke-width:1.2 }
.box-person { fill:var(--person); stroke:var(--person-line) }
.box-agent { fill:var(--agent); stroke:var(--agent-line) }
.box-auto { fill:var(--auto); stroke:var(--auto-line) }
.box-gate { fill:var(--gate); stroke:var(--gate) }
.title { font:600 12px var(--sans); fill:var(--ink); text-anchor:middle }
.tag { font:400 10px var(--mono); fill:var(--muted); text-anchor:middle }
.box-gate + .title, .box-gate + .title + .tag, .box-gate + .title + .tag + .tag, .box-gate + .title + .tag + .tag + .tag { fill:var(--gate-ink) }
.flow { fill:none; stroke:var(--arrow); stroke-width:1.4 }
.flow.bad { stroke:var(--bad) } .flow.ask { stroke:var(--ask); stroke-dasharray:4 3 }
.head { fill:var(--arrow) } .head-bad { fill:var(--bad) } .head-ask { fill:var(--ask) }
.note { font:400 11px var(--sans); fill:var(--muted) } .note.bad { fill:var(--bad) } .note.ask { fill:var(--ask) }
</style><defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-ask" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ask" d="M0 0 8 4 0 8z"/></marker>
</defs><rect class="lane lane-person" x="0" y="0" width="1364" height="92"/><text class="lane-name" x="14" y="50.0">Person</text><rect class="lane lane-auto" x="0" y="92" width="1364" height="92"/><text class="lane-name" x="14" y="142.0">standards</text><line class="rule" x1="0" y1="92" x2="1364" y2="92"/><rect class="lane lane-auto" x="0" y="184" width="1364" height="92"/><text class="lane-name" x="14" y="234.0">warehouse</text><line class="rule" x1="0" y1="184" x2="1364" y2="184"/><rect class="lane lane-auto" x="0" y="276" width="1364" height="92"/><text class="lane-name" x="14" y="326.0">shop</text><line class="rule" x1="0" y1="276" x2="1364" y2="276"/><rect class="box box-person" x="104" y="12" width="122" height="68" rx="4"/><text class="title" x="165" y="35">Merges a change,</text><text class="title" x="165" y="50">tags it</text><text class="tag" x="165" y="65">git tag v1.1.0</text><rect class="box box-auto" x="244" y="104" width="122" height="68" rx="4"/><text class="title" x="305" y="127">Opens the</text><text class="title" x="305" y="142">pull requests</text><text class="tag" x="305" y="157">release-pins</text><rect class="box box-auto" x="384" y="196" width="122" height="68" rx="4"/><text class="title" x="445" y="219">Moves the pin</text><text class="tag" x="445" y="234">deps.json</text><text class="tag" x="445" y="249">workflows</text><rect class="box box-auto" x="384" y="288" width="122" height="68" rx="4"/><text class="title" x="445" y="311">Moves the pin</text><text class="tag" x="445" y="326">deps.json</text><text class="tag" x="445" y="341">workflows</text><rect class="box box-gate" x="524" y="196" width="122" height="68" rx="4"/><text class="title" x="585" y="211.5">Gate</text><text class="tag" x="585" y="226.5">at v1.1.0</text><text class="tag" x="585" y="241.5">radical sense</text><text class="tag" x="585" y="256.5">radical check</text><rect class="box box-gate" x="524" y="288" width="122" height="68" rx="4"/><text class="title" x="585" y="303.5">Gate</text><text class="tag" x="585" y="318.5">at v1.1.0</text><text class="tag" x="585" y="333.5">radical sense</text><text class="tag" x="585" y="348.5">radical check</text><rect class="box box-person" x="664" y="12" width="122" height="68" rx="4"/><text class="title" x="725" y="42.5">Each team merges</text><text class="title" x="725" y="57.5">when it can</text><rect class="box box-auto" x="804" y="196" width="122" height="68" rx="4"/><text class="title" x="865" y="226.5">Deploys</text><text class="tag" x="865" y="241.5">images, smoke test</text><rect class="box box-person" x="944" y="12" width="122" height="68" rx="4"/><text class="title" x="1005" y="35">Tags the</text><text class="title" x="1005" y="50">Warehouse</text><text class="tag" x="1005" y="65">git tag v1.1.0</text><rect class="box box-auto" x="1084" y="196" width="122" height="68" rx="4"/><text class="title" x="1145" y="219">Publishes images,</text><text class="title" x="1145" y="234">opens a PR</text><text class="tag" x="1145" y="249">release-pins</text><rect class="box box-gate" x="1224" y="288" width="122" height="68" rx="4"/><text class="title" x="1285" y="303.5">Gate</text><text class="tag" x="1285" y="318.5">warehouse v1.1.0</text><text class="tag" x="1285" y="333.5">warehouse-contract</text><text class="tag" x="1285" y="348.5">radical check</text><path class="flow " d="M165 80V138H244" marker-end="url(#a)"/><path class="flow " d="M285 172V230H384" marker-end="url(#a)"/><path class="flow " d="M325 172V322H384" marker-end="url(#a)"/><path class="flow " d="M506 230H524" marker-end="url(#a)"/><path class="flow " d="M506 322H524" marker-end="url(#a)"/><path class="flow " d="M646 230H745V80" marker-end="url(#a)"/><path class="flow " d="M646 322H705V80" marker-end="url(#a)"/><text class="note " x="751" y="142" text-anchor="start">green</text><text class="note bad" x="524" y="176" text-anchor="start">red: names the service</text><path class="flow " d="M786 46H865V196" marker-end="url(#a)"/><text class="note " x="871" y="142" text-anchor="start">on merge</text><path class="flow " d="M926 230H1005V80" marker-end="url(#a)"/><path class="flow " d="M1066 46H1145V196" marker-end="url(#a)"/><path class="flow " d="M1206 230H1285V288" marker-end="url(#a)"/></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1364 368" role="img" aria-label="A person tags the standards, and nothing runs. Every day the Warehouse and the Shop each look at the tags of what they depend on. A new one becomes a pull request in that repository, with what changed in the model, and its Gate checks the repository against the new version. Each team merges when it can. A tag of the Warehouse reaches the Shop the same way."><style>
:root { --bg:#f4f6f9; --ink:#17202c; --muted:#566273; --rule:#d9dfe7; --arrow:#3d4a5c;
  --person:#fbefc9; --person-line:#a97a12; --agent:#e7e2fb; --agent-line:#5b47c4; --auto:#d9f0ea; --auto-line:#1b7f6b;
  --gate:#17202c; --gate-ink:#f4f6f9; --bad:#c2352c; --ask:#a97a12;
  --lane-person:#fbf6e6; --lane-agent:#f4f2fc; --lane-auto:#eaf6f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
@media (prefers-color-scheme: dark) { :root { --bg:#10151c; --ink:#e7ecf3; --muted:#9aa6b6; --rule:#28313d; --arrow:#aab5c4;
  --person:#3a2f12; --person-line:#d9a93a; --agent:#2a2452; --agent-line:#a494f2; --auto:#123a33; --auto-line:#4fc4a9;
  --gate:#e7ecf3; --gate-ink:#10151c; --bad:#f0746a; --ask:#d9a93a;
  --lane-person:#1a1810; --lane-agent:#17162a; --lane-auto:#101f1c } }
.lane-person { fill:var(--lane-person) } .lane-agent { fill:var(--lane-agent) } .lane-auto { fill:var(--lane-auto) }
.rule { stroke:var(--rule) }
.lane-name { font:600 12px var(--sans); fill:var(--muted) }
.box { stroke-width:1.2 }
.box-person { fill:var(--person); stroke:var(--person-line) }
.box-agent { fill:var(--agent); stroke:var(--agent-line) }
.box-auto { fill:var(--auto); stroke:var(--auto-line) }
.box-gate { fill:var(--gate); stroke:var(--gate) }
.title { font:600 12px var(--sans); fill:var(--ink); text-anchor:middle }
.tag { font:400 10px var(--mono); fill:var(--muted); text-anchor:middle }
.box-gate + .title, .box-gate + .title + .tag, .box-gate + .title + .tag + .tag, .box-gate + .title + .tag + .tag + .tag { fill:var(--gate-ink) }
.flow { fill:none; stroke:var(--arrow); stroke-width:1.4 }
.flow.bad { stroke:var(--bad) } .flow.ask { stroke:var(--ask); stroke-dasharray:4 3 }
.head { fill:var(--arrow) } .head-bad { fill:var(--bad) } .head-ask { fill:var(--ask) }
.note { font:400 11px var(--sans); fill:var(--muted) } .note.bad { fill:var(--bad) } .note.ask { fill:var(--ask) }
</style><defs>
<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-ask" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ask" d="M0 0 8 4 0 8z"/></marker>
</defs><rect class="lane lane-person" x="0" y="0" width="1364" height="92"/><text class="lane-name" x="14" y="50.0">Person</text><rect class="lane lane-auto" x="0" y="92" width="1364" height="92"/><text class="lane-name" x="14" y="142.0">standards</text><line class="rule" x1="0" y1="92" x2="1364" y2="92"/><rect class="lane lane-auto" x="0" y="184" width="1364" height="92"/><text class="lane-name" x="14" y="234.0">warehouse</text><line class="rule" x1="0" y1="184" x2="1364" y2="184"/><rect class="lane lane-auto" x="0" y="276" width="1364" height="92"/><text class="lane-name" x="14" y="326.0">shop</text><line class="rule" x1="0" y1="276" x2="1364" y2="276"/><rect class="box box-person" x="104" y="12" width="122" height="68" rx="4"/><text class="title" x="165" y="35">Merges a change,</text><text class="title" x="165" y="50">tags it</text><text class="tag" x="165" y="65">git tag v1.1.0</text><rect class="box box-auto" x="244" y="104" width="122" height="68" rx="4"/><text class="title" x="305" y="134.5">A new tag</text><text class="tag" x="305" y="149.5">nothing runs</text><rect class="box box-auto" x="384" y="196" width="122" height="68" rx="4"/><text class="title" x="445" y="219">Looks at the tags</text><text class="tag" x="445" y="234">every day</text><text class="tag" x="445" y="249">deps.json</text><rect class="box box-auto" x="384" y="288" width="122" height="68" rx="4"/><text class="title" x="445" y="311">Looks at the tags</text><text class="tag" x="445" y="326">every day</text><text class="tag" x="445" y="341">deps.json</text><rect class="box box-auto" x="524" y="196" width="122" height="68" rx="4"/><text class="title" x="585" y="211.5">Opens a</text><text class="title" x="585" y="226.5">pull request</text><text class="tag" x="585" y="241.5">the pin</text><text class="tag" x="585" y="256.5">radical diff</text><rect class="box box-auto" x="524" y="288" width="122" height="68" rx="4"/><text class="title" x="585" y="303.5">Opens a</text><text class="title" x="585" y="318.5">pull request</text><text class="tag" x="585" y="333.5">the pin</text><text class="tag" x="585" y="348.5">radical diff</text><rect class="box box-gate" x="664" y="196" width="122" height="68" rx="4"/><text class="title" x="725" y="211.5">Gate</text><text class="tag" x="725" y="226.5">at v1.1.0</text><text class="tag" x="725" y="241.5">radical sense</text><text class="tag" x="725" y="256.5">radical check</text><rect class="box box-gate" x="664" y="288" width="122" height="68" rx="4"/><text class="title" x="725" y="303.5">Gate</text><text class="tag" x="725" y="318.5">at v1.1.0</text><text class="tag" x="725" y="333.5">radical sense</text><text class="tag" x="725" y="348.5">radical check</text><rect class="box box-person" x="804" y="12" width="122" height="68" rx="4"/><text class="title" x="865" y="42.5">Reads the changes,</text><text class="title" x="865" y="57.5">merges when it can</text><rect class="box box-auto" x="944" y="196" width="122" height="68" rx="4"/><text class="title" x="1005" y="226.5">Deploys</text><text class="tag" x="1005" y="241.5">images, smoke test</text><rect class="box box-person" x="1084" y="12" width="122" height="68" rx="4"/><text class="title" x="1145" y="35">Tags the</text><text class="title" x="1145" y="50">Warehouse</text><text class="tag" x="1145" y="65">git tag v1.1.0</text><rect class="box box-auto" x="1224" y="196" width="122" height="68" rx="4"/><text class="title" x="1285" y="219">Publishes images</text><text class="tag" x="1285" y="234">the next day the</text><text class="tag" x="1285" y="249">Shop finds the tag</text><path class="flow " d="M165 80V138H244" marker-end="url(#a)"/><path class="flow ask" d="M445 196V138H366" marker-end="url(#a-ask)"/><text class="note ask" x="451" y="166" text-anchor="start">reads</text><path class="flow ask" d="M384 322H335V172" marker-end="url(#a-ask)"/><text class="note ask" x="329" y="300" text-anchor="end">reads</text><path class="flow " d="M506 230H524" marker-end="url(#a)"/><path class="flow " d="M506 322H524" marker-end="url(#a)"/><path class="flow " d="M646 230H664" marker-end="url(#a)"/><path class="flow " d="M646 322H664" marker-end="url(#a)"/><path class="flow " d="M786 230H885V80" marker-end="url(#a)"/><path class="flow " d="M786 322H845V80" marker-end="url(#a)"/><text class="note " x="891" y="142" text-anchor="start">green</text><text class="note bad" x="664" y="176" text-anchor="start">red: names the service</text><path class="flow " d="M926 46H1005V196" marker-end="url(#a)"/><text class="note " x="1011" y="142" text-anchor="start">on merge</text><path class="flow " d="M1066 230H1145V80" marker-end="url(#a)"/><path class="flow " d="M1206 46H1285V196" marker-end="url(#a)"/></svg>

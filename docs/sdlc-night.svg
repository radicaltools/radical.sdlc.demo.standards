<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1364 276" role="img" aria-label="Every night the sensors and the fuzz file measure, an agent per area explores, each finding runs again without the agent, and findings a person merges start the next fix."><style>
:root { --bg:#f4f6f9; --ink:#17202c; --muted:#566273; --rule:#d9dfe7; --arrow:#3d4a5c;
  --person:#fbefc9; --person-line:#a97a12; --agent:#e7e2fb; --agent-line:#5b47c4; --auto:#d9f0ea; --auto-line:#1b7f6b;
  --gate:#17202c; --gate-ink:#f4f6f9; --bad:#c2352c; --ask:#a97a12;
  --lane-person:#fbf6e6; --lane-agent:#f4f2fc; --lane-auto:#eaf6f3;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
@media (prefers-color-scheme: dark) { :root { --bg:#10151c; --ink:#e7ecf3; --muted:#9aa6b6; --rule:#28313d; --arrow:#aab5c4;
  --person:#3a2f12; --person-line:#d9a93a; --agent:#2a2452; --agent-line:#a494f2; --auto:#123a33; --auto-line:#4fc4a9;
  --gate:#e7ecf3; --gate-ink:#10151c; --bad:#f0746a; --ask:#d9a93a;
  --lane-person:#1a1810; --lane-agent:#17162a; --lane-auto:#101f1c } }
.lane-person { fill:var(--lane-person) } .lane-agent { fill:var(--lane-agent) } .lane-auto { fill:var(--lane-auto) }
.rule { stroke:var(--rule) }
.lane-name { font:600 12px var(--sans); fill:var(--muted) }
.box { stroke-width:1.2 }
.box-person { fill:var(--person); stroke:var(--person-line) }
.box-agent { fill:var(--agent); stroke:var(--agent-line) }
.box-auto { fill:var(--auto); stroke:var(--auto-line) }
.box-gate { fill:var(--gate); stroke:var(--gate) }
.title { font:600 12px var(--sans); fill:var(--ink); text-anchor:middle }
.tag { font:400 10px var(--mono); fill:var(--muted); text-anchor:middle }
.box-gate + .title, .box-gate + .title + .tag, .box-gate + .title + .tag + .tag, .box-gate + .title + .tag + .tag + .tag { fill:var(--gate-ink) }
.flow { fill:none; stroke:var(--arrow); stroke-width:1.4 }
.flow.bad { stroke:var(--bad) } .flow.ask { stroke:var(--ask); stroke-dasharray:4 3 }
.head { fill:var(--arrow) } .head-bad { fill:var(--bad) } .head-ask { fill:var(--ask) }
.note { font:400 11px var(--sans); fill:var(--muted) } .note.bad { fill:var(--bad) } .note.ask { fill:var(--ask) }
</style><defs>
<marker id="na" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-bad" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-bad" d="M0 0 8 4 0 8z"/></marker>
<marker id="a-ask" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ask" d="M0 0 8 4 0 8z"/></marker>
</defs><rect class="lane lane-person" x="0" y="0" width="1364" height="92"/><text class="lane-name" x="14" y="50.0">Person</text><rect class="lane lane-agent" x="0" y="92" width="1364" height="92"/><text class="lane-name" x="14" y="142.0">Agents</text><line class="rule" x1="0" y1="92" x2="1364" y2="92"/><rect class="lane lane-auto" x="0" y="184" width="1364" height="92"/><text class="lane-name" x="14" y="234.0">Automation</text><line class="rule" x1="0" y1="184" x2="1364" y2="184"/><rect class="box box-auto" x="104" y="196" width="170" height="68" rx="4"/><text class="title" x="189.0" y="219.0">Measures and fuzzes</text><text class="tag" x="189.0" y="234.0">radical sense</text><text class="tag" x="189.0" y="249.0">radical fuzz night</text><rect class="box box-agent" x="314" y="104" width="170" height="68" rx="4"/><text class="title" x="399.0" y="127.0">An agent per area tries</text><text class="title" x="399.0" y="142.0">to break the rules</text><text class="tag" x="399.0" y="157.0">radical explore prepare</text><rect class="box box-auto" x="524" y="196" width="170" height="68" rx="4"/><text class="title" x="609.0" y="219.0">Runs each finding again</text><text class="tag" x="609.0" y="234.0">radical explore verify</text><text class="tag" x="609.0" y="249.0">radical explore record</text><rect class="box box-auto" x="734" y="196" width="170" height="68" rx="4"/><text class="title" x="819.0" y="226.5">Proposes the findings</text><text class="tag" x="819.0" y="241.5">bot/nightly-findings</text><rect class="box box-person" x="944" y="12" width="170" height="68" rx="4"/><text class="title" x="1029.0" y="42.5">Merges them</text><text class="tag" x="1029.0" y="57.5">starts a fix by hand</text><rect class="box box-agent" x="1154" y="104" width="170" height="68" rx="4"/><text class="title" x="1239.0" y="127.0">Model, then coding agent</text><text class="tag" x="1239.0" y="142.0">radical fuzz --replay</text><text class="tag" x="1239.0" y="157.0">radical harden</text><path class="flow " d="M274 230H399.0V172" marker-end="url(#na)"/><path class="flow " d="M484 138H609.0V196" marker-end="url(#na)"/><path class="flow " d="M694 230H734" marker-end="url(#na)"/><path class="flow " d="M904 230H1029.0V80" marker-end="url(#na)"/><path class="flow " d="M1114 46H1239.0V104" marker-end="url(#na)"/><text class="note " x="1245.0" y="74" text-anchor="start">on a finding</text><path class="flow " d="M1239.0 172V218" marker-end="url(#na)"/><text class="note " x="1239.0" y="236" text-anchor="middle">the same gate, the same merge</text></svg>

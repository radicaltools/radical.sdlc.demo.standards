name: Nightly

# What runs without anyone asking: sensors against the last seven nights, fuzz on a random
# seed, an exploratory round. Everything new is proposed on one rolling branch.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly

permissions:
  contents: read
  actions: read

jobs:
  night:
    uses: radicaltools/radical.tools.sdlc.demo.2.standards/.github/workflows/nightly.yml@v1.0.5
    secrets: inherit

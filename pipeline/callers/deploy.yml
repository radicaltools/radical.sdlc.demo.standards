name: Deploy

# Every commit on main and every version tag: the images are built, the stack starts on the
# runner as a staging, the fitness functions triggered on deploy measure it, and only when
# radical check passes on that are the images published.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    uses: radicaltools/radical.tools.sdlc.demo.2.standards/.github/workflows/deploy.yml@v1.0.5
    secrets: inherit

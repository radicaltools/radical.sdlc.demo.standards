name: Reconcile

# The model on main is the state wanted: this brings the code to it, when the model or what the code
# has reached changes on main, every day, or by hand.

on:
  push:
    branches: [main]
    paths: ['.radical/model/**', '.radical/reconciled.json']
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: reconcile

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  reconcile:
    uses: radicaltools/radical.tools.sdlc.demo.2.standards/.github/workflows/reconcile.yml@v2.3.0
    secrets: inherit
